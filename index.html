<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 → 텍스트 + 영어 번역 + 읽어주기</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0; padding: 24px; background: #f5f6f8; color: #1b1c1e;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 980px; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .row.sub { padding: 10px 12px; background: #f9fafb; border-radius: 8px; }
  button { padding: 10px 18px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  #start { background: #2563eb; color: #fff; }
  #grantBtn { background: #7c3aed; color: #fff; padding: 8px 14px; font-size: 13px; }
  #speakAll { background: #059669; color: #fff; padding: 8px 14px; font-size: 13px; }
  #stopSpeak, #stop, #clear, #copySrc, #copyEn, #releaseBtn, #diagBtn { background: #e5e7eb; color: #374151; }
  #stopSpeak, #releaseBtn, #diagBtn { padding: 8px 14px; font-size: 13px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select { padding: 9px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; max-width: 230px; }
  label.chk { font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .slider { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; }
  input[type=range] { width: 100px; }
  #status { font-size: 13px; color: #6b7280; margin-bottom: 10px; }
  #status.rec { color: #dc2626; font-weight: 600; }

  .micbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 10px 12px; border-radius: 8px; margin-bottom: 12px;
            background: #f1f5f9; border: 1px solid #e2e8f0; font-size: 13px; }
  .micbar.on  { background: #ecfdf5; border-color: #a7f3d0; }
  .micbar.off { background: #fef3c7; border-color: #fde68a; }
  .micbar.deny{ background: #fef2f2; border-color: #fecaca; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; flex: none; }
  .micbar.on .dot { background: #10b981; animation: pulse 1.6s infinite; }
  .micbar.deny .dot { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .meter { width: 90px; height: 7px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0%; background: #10b981; transition: width .08s linear; }

  #diag { display: none; margin-bottom: 12px; padding: 12px; background: #0f172a; color: #cbd5e1;
          border-radius: 8px; font-family: ui-monospace, Menlo, Consolas, monospace;
          font-size: 12px; line-height: 1.7; white-space: pre-wrap; }
  #diag b { color: #f8fafc; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .warn { color: #fbbf24; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .col h2 { font-size: 13px; margin: 0 0 6px; color: #374151; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #4338ca; }
  .badge.off { background: #fef3c7; color: #92400e; }
  .badge.speaking { background: #d1fae5; color: #065f46; }
  textarea { width: 100%; min-height: 240px; padding: 14px; font-size: 15px; line-height: 1.6;
             border: 1px solid #d1d5db; border-radius: 8px; resize: vertical; font-family: inherit; }
  #enOut { background: #f9fafb; }
  #enOut.speaking { background: #ecfdf5; border-color: #6ee7b7; }
  .interim { color: #9ca3af; font-style: italic; min-height: 22px; font-size: 14px; margin-top: 6px; }
  .err { background: #fef2f2; color: #b91c1c; padding: 12px; border-radius: 8px; font-size: 14px; display: none; margin-bottom: 12px; }
  .note { font-size: 12px; color: #6b7280; margin-top: 12px; line-height: 1.6; }
  code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>마이크 음성 → 텍스트 + 영어 번역 + 읽어주기</h1>
  <div id="errBox" class="err"></div>

  <div class="panel">
    <div id="micbar" class="micbar">
      <span class="dot"></span>
      <b>마이크</b>
      <span id="micState">확인 중…</span>
      <div class="meter"><i id="meterBar"></i></div>
      <label class="chk"><input type="checkbox" id="keepAlive" checked> 상시 유지</label>
      <button id="grantBtn">권한 요청 / 연결</button>
      <button id="releaseBtn">연결 해제</button>
      <button id="diagBtn">진단</button>
      <!-- value="default" 필수: 없으면 "기본 장치" 문자열이 deviceId로 들어가 OverconstrainedError 발생 -->
      <select id="deviceSel" title="입력 장치" disabled>
        <option value="default">기본 장치</option>
      </select>
    </div>

    <div id="diag"></div>

    <div class="row">
      <button id="start">● 녹음 시작</button>
      <button id="stop" disabled>■ 중지</button>
      <button id="clear">지우기</button>
      <select id="lang">
        <option value="ko-KR" data-src="ko">한국어</option>
        <option value="ja-JP" data-src="ja">日本語</option>
        <option value="zh-CN" data-src="zh">中文</option>
        <option value="es-ES" data-src="es">Español</option>
        <option value="en-US" data-src="en">English (번역 없음)</option>
      </select>
      <label class="chk"><input type="checkbox" id="continuous" checked> 연속 인식</label>
      <label class="chk"><input type="checkbox" id="doTrans" checked> 영어 번역</label>
    </div>

    <div class="row sub">
      <label class="chk"><input type="checkbox" id="autoSpeak" checked> 🔊 자동 읽기</label>
      <select id="voiceSel"><option>음성 로딩 중…</option></select>
      <div class="slider">속도 <input type="range" id="rate" min="0.5" max="1.8" step="0.1" value="1"><span id="rateVal">1.0</span></div>
      <div class="slider">음높이 <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"><span id="pitchVal">1.0</span></div>
      <button id="speakAll">▶ 전체 읽기</button>
      <button id="stopSpeak">⏹ 중지</button>
    </div>

    <div id="status">대기 중</div>

    <div class="cols">
      <div class="col">
        <h2><span>원문 (인식 결과)</span><button id="copySrc" style="padding:4px 10px;font-size:12px;">복사</button></h2>
        <textarea id="srcOut" placeholder="인식된 텍스트가 여기에 표시됩니다."></textarea>
        <div id="srcInterim" class="interim"></div>
      </div>
      <div class="col">
        <h2><span>English <span id="engine" class="badge">확인 중…</span></span>
            <button id="copyEn" style="padding:4px 10px;font-size:12px;">복사</button></h2>
        <textarea id="enOut" placeholder="English translation appears here." readonly></textarea>
        <div id="enInterim" class="interim"></div>
      </div>
    </div>

    <div class="note">
      · 반드시 <code>.html</code> 파일로 저장해 <b>브라우저 탭에서 직접</b> 여세요. iframe 미리보기에서는 마이크가 차단됩니다.<br>
      · <code>https://</code> 또는 <code>http://localhost</code> 필요 — <code>python3 -m http.server 8000</code> 추천.<br>
      · 문제가 생기면 <b>[진단]</b> 버튼으로 환경을 점검하세요.
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  const $ = id => document.getElementById(id);

  const startBtn=$('start'), stopBtn=$('stop'), clearBtn=$('clear'),
        langSel=$('lang'), contChk=$('continuous'), transChk=$('doTrans'),
        autoSpeakChk=$('autoSpeak'), voiceSel=$('voiceSel'),
        rateEl=$('rate'), pitchEl=$('pitch'), rateVal=$('rateVal'), pitchVal=$('pitchVal'),
        speakAllBtn=$('speakAll'), stopSpeakBtn=$('stopSpeak'),
        statusEl=$('status'), srcOut=$('srcOut'), enOut=$('enOut'),
        srcInterim=$('srcInterim'), enInterim=$('enInterim'),
        engineBadge=$('engine'), errBox=$('errBox'),
        micbar=$('micbar'), micState=$('micState'), meterBar=$('meterBar'),
        keepAliveChk=$('keepAlive'), grantBtn=$('grantBtn'), releaseBtn=$('releaseBtn'),
        diagBtn=$('diagBtn'), diagBox=$('diag'), deviceSel=$('deviceSel');

  /* ═══════════ 0. 환경 사전 점검 ═══════════ */
  const inIframe = (() => { try { return window.self !== window.top; } catch { return true; } })();

  function showErr(msg) { errBox.style.display = 'block'; errBox.innerHTML = msg; }

  if (!SR) {
    showErr('이 브라우저는 <b>Web Speech API</b>를 지원하지 않습니다. 데스크톱 Chrome 또는 Edge를 사용하세요.');
    startBtn.disabled = true;
  }
  if (!window.isSecureContext || !navigator.mediaDevices) {
    showErr('<b>보안 컨텍스트가 아닙니다.</b> file:// 로 열면 마이크를 쓸 수 없습니다. ' +
            '터미널에서 <code>python3 -m http.server 8000</code> 실행 후 ' +
            '<code>http://localhost:8000</code> 으로 접속하세요.');
  } else if (inIframe) {
    showErr('<b>iframe 안에서 실행 중입니다.</b> 부모 페이지에 <code>allow="microphone"</code> 이 없으면 ' +
            '권한 팝업이 뜨지 않습니다. HTML을 저장해 브라우저 탭에서 직접 열어 주세요.');
  }

  /* ═══════════ 1. 마이크: 단계적 폴백 획득 ═══════════ */
  let micStream = null;
  let audioCtx = null, analyser = null, meterRAF = null;
  let devicesLoaded = false;

  function setMicUI(state, text) {
    micbar.className = 'micbar ' + state;
    micState.textContent = text;
    releaseBtn.disabled = !micStream;
    grantBtn.disabled = !!micStream;
    deviceSel.disabled = !devicesLoaded;
  }

  /* deviceId 유효성 — 실제 deviceId는 긴 해시 문자열 */
  function selectedDeviceId() {
    const v = deviceSel.value;
    if (!v || v === 'default' || v.length < 10) return null;
    return v;
  }

  /*
   * 제약 조건을 3단계로 완화하며 시도한다.
   *  1) 지정 장치 + 오디오 처리 옵션
   *  2) 기본 장치 + 오디오 처리 옵션
   *  3) { audio: true }  ← 거의 항상 성공
   */
  function buildConstraintLadder() {
    const proc = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
    const id = selectedDeviceId();
    const ladder = [];
    if (id) ladder.push({ audio: Object.assign({ deviceId: { exact: id } }, proc) });
    ladder.push({ audio: proc });
    ladder.push({ audio: true });
    return ladder;
  }

  async function acquireMic() {
    if (micStream) return micStream;
    if (!navigator.mediaDevices?.getUserMedia) {
      setMicUI('deny', 'getUserMedia 미지원 — https 또는 localhost 로 접속하세요');
      return null;
    }

    setMicUI('off', '연결 중…');
    const ladder = buildConstraintLadder();
    let lastErr = null;

    for (let i = 0; i < ladder.length; i++) {
      try {
        micStream = await navigator.mediaDevices.getUserMedia(ladder[i]);
        if (i > 0) deviceSel.value = 'default';   // 폴백됐으면 선택 초기화
        break;
      } catch (err) {
        lastErr = err;
        // 권한 거부·장치 없음은 조건을 완화해도 소용없으므로 즉시 중단
        if (err.name === 'NotAllowedError' || err.name === 'SecurityError' || err.name === 'NotFoundError') break;
        // OverconstrainedError / NotReadableError / TypeError → 다음 단계로 완화 재시도
      }
    }

    if (!micStream) { reportMicError(lastErr); return null; }

    micStream.getAudioTracks().forEach(t => {
      t.onended = () => {
        micStream = null;
        setMicUI('off', '트랙 종료됨 — 재연결 시도 중…');
        if (keepAliveChk.checked) setTimeout(acquireMic, 800);
      };
    });

    startMeter(micStream);
    await listDevices();                 // 권한 획득 후에야 label/deviceId가 채워짐
    const label = micStream.getAudioTracks()[0]?.label || '기본 장치';
    setMicUI('on', '연결됨 · ' + label.slice(0, 28));
    return micStream;
  }

  function reportMicError(err) {
    if (!err) { setMicUI('deny', '알 수 없는 오류'); return; }
    const map = {
      NotAllowedError: inIframe
        ? '권한 차단 — iframe 제약이거나 사이트가 차단 상태입니다. 탭에서 직접 열고 자물쇠 아이콘 → 마이크 → 허용'
        : '권한 거부됨 — 주소창 자물쇠 아이콘 → 마이크 → "허용"으로 변경 후 새로고침',
      SecurityError:      '보안 정책 차단 — https:// 또는 localhost 로 접속하세요',
      NotFoundError:      '마이크 장치를 찾을 수 없습니다 (연결 상태 확인)',
      NotReadableError:   '다른 앱이 마이크를 점유 중입니다 (Zoom/Teams 등 종료 후 재시도)',
      OverconstrainedError: '장치 조건 불일치 — 기본 장치로 재시도하세요',
      AbortError:         '요청이 중단되었습니다. 다시 시도하세요'
    };
    setMicUI('deny', map[err.name] || ('연결 실패: ' + err.name));
    console.error('[mic]', err);
  }

  function releaseMic() {
    if (meterRAF) { cancelAnimationFrame(meterRAF); meterRAF = null; }
    if (micStream) micStream.getTracks().forEach(t => { t.onended = null; t.stop(); });
    micStream = null;
    meterBar.style.width = '0%';
    setMicUI('off', '연결 해제됨');
  }

  function startMeter(stream) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      (function tick() {
        analyser.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) {
          const d = Math.abs(buf[i] - 128);
          if (d > peak) peak = d;
        }
        meterBar.style.width = Math.min(100, (peak / 64) * 100) + '%';
        meterRAF = requestAnimationFrame(tick);
      })();
    } catch (e) { console.warn('[meter]', e); }
  }

  /* 권한 획득 이후에만 호출할 것 — 그 전에는 deviceId/label이 빈 문자열 */
  async function listDevices() {
    if (!navigator.mediaDevices?.enumerateDevices) return;
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices())
                   .filter(d => d.kind === 'audioinput' && d.deviceId && d.deviceId !== 'default');
      const cur = deviceSel.value;
      deviceSel.innerHTML = '<option value="default">기본 장치</option>';
      devs.forEach((d, i) => {
        const o = document.createElement('option');
        o.value = d.deviceId;
        o.textContent = d.label || ('마이크 ' + (i + 1));
        deviceSel.appendChild(o);
      });
      devicesLoaded = devs.length > 0;
      deviceSel.disabled = !devicesLoaded;
      if (cur && [...deviceSel.options].some(o => o.value === cur)) deviceSel.value = cur;
    } catch (e) { console.warn('[devices]', e); }
  }

  /* 권한 상태 구독 */
  async function watchPermission() {
    if (!navigator.permissions?.query) { setMicUI('off', '권한 필요 — [권한 요청] 클릭'); return; }
    try {
      const p = await navigator.permissions.query({ name: 'microphone' });
      applyPerm(p.state);
      p.onchange = () => applyPerm(p.state);
    } catch { setMicUI('off', '권한 필요 — [권한 요청] 클릭'); }
  }
  function applyPerm(state) {
    if (state === 'granted') {
      if (!micStream && keepAliveChk.checked) acquireMic();
      else if (micStream) setMicUI('on', '연결됨 · 상시 유지 중');
      else setMicUI('', '허용됨 (미연결)');
    } else if (state === 'denied') {
      setMicUI('deny', '차단됨 — 자물쇠 아이콘 → 마이크 → 허용 후 새로고침');
    } else {
      setMicUI('off', '권한 필요 — [권한 요청] 클릭');
    }
  }

  grantBtn.addEventListener('click', acquireMic);   // 반드시 사용자 클릭 안에서 호출
  releaseBtn.addEventListener('click', releaseMic);
  keepAliveChk.addEventListener('change', () => {
    if (keepAliveChk.checked) acquireMic();
    else if (!wantListening) releaseMic();
  });
  deviceSel.addEventListener('change', async () => { releaseMic(); await acquireMic(); });
  navigator.mediaDevices?.addEventListener?.('devicechange', () => { if (micStream) listDevices(); });

  /* ═══════════ 2. 진단 패널 ═══════════ */
  diagBtn.addEventListener('click', async () => {
    const on = diagBox.style.display === 'block';
    if (on) { diagBox.style.display = 'none'; return; }
    diagBox.style.display = 'block';
    diagBox.textContent = '점검 중…';

    const mark = (ok, t) => `<span class="${ok ? 'ok' : 'bad'}">${ok ? '✔' : '✘'} ${t}</span>`;
    const lines = [];
    lines.push('<b>환경 진단</b>');
    lines.push(mark(window.isSecureContext, '보안 컨텍스트 (https/localhost)') + ` — ${location.protocol}//${location.host || '(file)'}`);
    lines.push(mark(!inIframe, 'iframe 아님') + (inIframe ? ' — 부모의 allow="microphone" 필요' : ''));
    lines.push(mark(!!navigator.mediaDevices?.getUserMedia, 'getUserMedia 사용 가능'));
    lines.push(mark(!!SR, 'SpeechRecognition 지원'));
    lines.push(mark(!!synth, 'speechSynthesis 지원'));
    lines.push(mark(!!self.Translator, 'on-device Translator API') + (self.Translator ? '' : ' — 폴백 모드로 동작'));

    if (navigator.permissions?.query) {
      try {
        const p = await navigator.permissions.query({ name: 'microphone' });
        lines.push(`<span class="${p.state === 'granted' ? 'ok' : p.state === 'denied' ? 'bad' : 'warn'}">● 권한 상태: ${p.state}</span>`);
      } catch { lines.push('<span class="warn">● 권한 상태: 조회 불가</span>'); }
    }
    lines.push(mark(!!micStream, '마이크 스트림 연결됨'));
    if (micStream) {
      const t = micStream.getAudioTracks()[0];
      lines.push(`   └ 장치: ${t.label || '(이름 없음)'} / state=${t.readyState}`);
    }
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
      lines.push(`● 입력 장치 ${devs.length}개` + (devs[0]?.label ? '' : ' <span class="warn">(라벨 비어있음 = 권한 미획득)</span>'));
    } catch {}
    lines.push(`● UA: ${navigator.userAgent.slice(0, 90)}`);
    diagBox.innerHTML = lines.join('\n');
  });

  /* ═══════════ 3. TTS ═══════════ */
  let voices = [], ttsActive = false;

  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    if (!voices.length) return;
    voiceSel.innerHTML = '';
    voices.forEach((v, i) => {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = `${v.name} (${v.lang})${v.localService ? ' · 로컬' : ''}`;
      voiceSel.appendChild(o);
    });
    const pref = voices.findIndex(v => /en-US/i.test(v.lang));
    voiceSel.selectedIndex = pref >= 0 ? pref : 0;
  }
  if (synth) {
    loadVoices();
    synth.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 500);   // 일부 브라우저는 지연 로드
  } else {
    autoSpeakChk.checked = false; autoSpeakChk.disabled = true; speakAllBtn.disabled = true;
    voiceSel.innerHTML = '<option>TTS 미지원</option>';
  }

  rateEl.addEventListener('input', () => rateVal.textContent = (+rateEl.value).toFixed(1));
  pitchEl.addEventListener('input', () => pitchVal.textContent = (+pitchEl.value).toFixed(1));

  function makeUtterance(text) {
    const u = new SpeechSynthesisUtterance(text);
    const v = voices[+voiceSel.value];
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = +rateEl.value;
    u.pitch = +pitchEl.value;
    return u;
  }

  function speak(text, opts) {
    const muteMic = !opts || opts.muteMic !== false;
    if (!synth || !text || !text.trim()) return;
    const u = makeUtterance(text);
    u.onstart = () => {
      ttsActive = true;
      enOut.classList.add('speaking');
      setBadge('🔊 읽는 중', false, true);
      if (muteMic && recognizing) pauseRecognizer();
    };
    u.onend = u.onerror = () => {
      ttsActive = false;
      enOut.classList.remove('speaking');
      restoreBadge();
      if (muteMic && wantListening) resumeRecognizer();
    };
    synth.speak(u);
  }
  const autoSpeak = t => { if (autoSpeakChk.checked) speak(t); };

  speakAllBtn.addEventListener('click', () => {
    if (!enOut.value.trim()) return;
    synth.cancel();
    const chunks = enOut.value.match(/[^.!?]+[.!?]*/g) || [enOut.value];
    chunks.forEach((c, i) => {
      const txt = c.trim();
      if (!txt) return;
      const u = makeUtterance(txt);
      if (i === 0) u.onstart = () => { enOut.classList.add('speaking'); setBadge('🔊 읽는 중', false, true); };
      if (i === chunks.length - 1) u.onend = () => { enOut.classList.remove('speaking'); restoreBadge(); };
      synth.speak(u);
    });
  });

  stopSpeakBtn.addEventListener('click', () => {
    if (synth) synth.cancel();
    ttsActive = false;
    enOut.classList.remove('speaking');
    restoreBadge();
    if (wantListening) resumeRecognizer();
  });

  enOut.addEventListener('dblclick', () => {
    const sel = window.getSelection().toString().trim();
    if (sel) { synth.cancel(); speak(sel, { muteMic: false }); }
  });

  /* ═══════════ 4. 번역 ═══════════ */
  let translator = null, translatorLang = null, translatorReady = false;
  let lastBadge = { t: '확인 중…', warn: true };
  const srcCode = () => langSel.options[langSel.selectedIndex].dataset.src;

  function setBadge(text, warn, transient) {
    engineBadge.textContent = text;
    engineBadge.className = 'badge' + (transient ? ' speaking' : (warn ? ' off' : ''));
    if (!transient) lastBadge = { t: text, warn: warn };
  }
  const restoreBadge = () => setBadge(lastBadge.t, lastBadge.warn);

  async function ensureTranslator() {
    const src = srcCode();
    if (src === 'en') { translator = null; translatorReady = false; setBadge('번역 불필요', true); return false; }
    if (!self.Translator) { translatorReady = false; setBadge('폴백: 영어 직접 인식', true); return false; }
    if (translator && translatorLang === src) return true;
    try {
      setBadge('모델 준비 중…', true);
      const av = await self.Translator.availability({ sourceLanguage: src, targetLanguage: 'en' });
      if (av === 'unavailable') { setBadge('폴백: 영어 직접 인식', true); translatorReady = false; return false; }
      translator = await self.Translator.create({
        sourceLanguage: src, targetLanguage: 'en',
        monitor(m) {
          m.addEventListener('downloadprogress', e =>
            setBadge('모델 다운로드 ' + Math.round(e.loaded * 100) + '%', true));
        }
      });
      translatorLang = src; translatorReady = true;
      setBadge('on-device 번역', false);
      return true;
    } catch (e) {
      console.warn('[translator]', e);
      translatorReady = false;
      setBadge('폴백: 영어 직접 인식', true);
      return false;
    }
  }

  let queue = Promise.resolve();
  function enqueueTranslate(text) {
    queue = queue.then(async () => {
      if (!translatorReady || !translator) return;
      try {
        const out = (await translator.translate(text)).trim();
        enOut.value += out + ' ';
        enOut.scrollTop = enOut.scrollHeight;
        enInterim.textContent = '';
        autoSpeak(out);
      } catch (e) { console.warn('[translate]', e); }
    });
  }

  let interimTimer = null;
  function previewTranslate(text) {
    if (!translatorReady || !text) { enInterim.textContent = ''; return; }
    clearTimeout(interimTimer);
    interimTimer = setTimeout(async () => {
      try { enInterim.textContent = await translator.translate(text); } catch (e) {}
    }, 350);
  }

  /* ═══════════ 5. 음성 인식 ═══════════ */
  let recMain = null, recEn = null;
  let wantListening = false, recognizing = false, recPaused = false;
  let watchdog = null, lastActivity = 0;

  function buildRecognizer(langCode, handlers) {
    const r = new SR();
    r.lang = langCode;
    r.continuous = contChk.checked;
    r.interimResults = true;
    r.maxAlternatives = 1;
    Object.assign(r, handlers);
    return r;
  }

  function pauseRecognizer() {   // 인식기만 중단, micStream은 유지
    recPaused = true;
    statusEl.textContent = '🔊 읽는 중 — 인식 일시 중지 (마이크 연결 유지)';
    statusEl.classList.remove('rec');
    try { if (recMain) recMain.abort(); } catch (e) {}
    try { if (recEn) recEn.abort(); } catch (e) {}
    recognizing = false;
  }
  function resumeRecognizer() {
    if (!wantListening || !recPaused) return;
    recPaused = false;
    setTimeout(() => { if (wantListening && !ttsActive) safeStart(); }, 250);
  }

  function safeStart() {
    if (recognizing || !SR) return;
    try { startRecognizers(); }
    catch (e) {
      if (e.name !== 'InvalidStateError') {
        statusEl.textContent = '시작 실패: ' + e.message;
        console.error('[recognition]', e);
      }
    }
  }

  function startRecognizers() {
    recMain = buildRecognizer(langSel.value, {
      onstart() {
        recognizing = true; lastActivity = Date.now();
        statusEl.textContent = '🎙 듣는 중... 말씀하세요';
        statusEl.classList.add('rec');
        startBtn.disabled = true; stopBtn.disabled = false;
      },
      onaudiostart() { lastActivity = Date.now(); },
      onresult(e) {
        lastActivity = Date.now();
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) {
            const fin = t.trim();
            if (!fin) continue;
            srcOut.value += fin + ' ';
            if (transChk.checked && translatorReady) enqueueTranslate(fin);
            else if (srcCode() === 'en') autoSpeak(fin);
          } else interim += t;
        }
        srcInterim.textContent = interim;
        srcOut.scrollTop = srcOut.scrollHeight;
        if (transChk.checked) previewTranslate(interim);
      },
      onerror(e) {
        if (e.error === 'aborted' || e.error === 'no-speech') { lastActivity = Date.now(); return; }
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          wantListening = false; applyPerm('denied');
        }
        handleRecErr(e);
      },
      onend() {
        recognizing = false;
        if (recPaused) return;
        if (wantListening) { setTimeout(safeStart, 120); return; }
        finishUI();
      }
    });
    recMain.start();

    // 내장 번역기가 없을 때만 en-US 인식기 병행
    if (transChk.checked && !translatorReady && srcCode() !== 'en') {
      recEn = buildRecognizer('en-US', {
        onresult(e) {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) {
              const fin = t.trim();
              if (!fin) continue;
              enOut.value += fin + ' ';
              enOut.scrollTop = enOut.scrollHeight;
              autoSpeak(fin);
            } else interim += t;
          }
          enInterim.textContent = interim;
        },
        onerror() {},
        onend() {
          if (wantListening && !recPaused && contChk.checked) { try { recEn.start(); } catch (e) {} }
        }
      });
      try { recEn.start(); } catch (e) { console.warn('병행 인식기 기동 실패(무시 가능)', e); }
    }
  }

  function startWatchdog() {
    stopWatchdog();
    watchdog = setInterval(() => {
      if (!wantListening || recPaused || ttsActive) return;
      if (keepAliveChk.checked && !micStream) { acquireMic(); return; }
      if (!recognizing) { safeStart(); return; }
      if (Date.now() - lastActivity > 15000) {
        try { recMain.abort(); } catch (e) {}
        lastActivity = Date.now();
      }
    }, 3000);
  }
  function stopWatchdog() { if (watchdog) { clearInterval(watchdog); watchdog = null; } }

  function handleRecErr(e) {
    const map = {
      'not-allowed': '마이크 권한이 거부되었습니다. 자물쇠 아이콘 → 마이크 → "허용"으로 변경하세요.',
      'service-not-allowed': '음성 인식 서비스가 차단되었습니다.',
      'audio-capture': '마이크를 찾을 수 없습니다.',
      'network': '네트워크 오류 — 인식 서비스에 연결할 수 없습니다.'
    };
    statusEl.textContent = map[e.error] || ('오류: ' + e.error);
    statusEl.classList.remove('rec');
  }

  function finishUI() {
    statusEl.textContent = micStream ? '대기 중 (마이크 연결 유지)' : '대기 중';
    statusEl.classList.remove('rec');
    srcInterim.textContent = ''; enInterim.textContent = '';
    startBtn.disabled = false; stopBtn.disabled = true;
  }

  /* ═══════════ 6. UI 바인딩 ═══════════ */
  startBtn.addEventListener('click', async () => {
    const s = await acquireMic();
    if (!s) { statusEl.textContent = '마이크 연결 실패 — 상단 상태 바와 [진단]을 확인하세요.'; return; }
    if (transChk.checked) await ensureTranslator();
    wantListening = true;
    safeStart();
    startWatchdog();
  });

  stopBtn.addEventListener('click', () => {
    wantListening = false; recPaused = false;
    stopWatchdog();
    try { if (recMain) recMain.stop(); } catch (e) {}
    try { if (recEn) recEn.stop(); } catch (e) {}
    recEn = null;
    finishUI();
    if (!keepAliveChk.checked) releaseMic();
  });

  clearBtn.addEventListener('click', () => {
    srcOut.value = ''; enOut.value = '';
    srcInterim.textContent = ''; enInterim.textContent = '';
  });

  $('copySrc').addEventListener('click', () => copy(srcOut, $('copySrc')));
  $('copyEn').addEventListener('click', () => copy(enOut, $('copyEn')));
  async function copy(el, btn) {
    if (!el.value) return;
    try { await navigator.clipboard.writeText(el.value); }
    catch (e) { el.select(); document.execCommand('copy'); }
    const old = btn.textContent;
    btn.textContent = '복사됨';
    setTimeout(() => { btn.textContent = old; }, 1200);
  }

  [langSel, contChk, transChk].forEach(el => el.addEventListener('change', async () => {
    const running = wantListening;
    if (running) {
      wantListening = false;
      try { if (recMain) recMain.stop(); if (recEn) recEn.stop(); } catch (e) {}
      recEn = null;
    }
    translator = null; translatorLang = null;
    if (transChk.checked) await ensureTranslator();
    if (running) { wantListening = true; setTimeout(safeStart, 300); }
  }));

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (keepAliveChk.checked && !micStream) acquireMic();
    if (wantListening && !recognizing && !recPaused) safeStart();
  });

  window.addEventListener('beforeunload', () => { if (synth) synth.cancel(); stopWatchdog(); });

  /* 초기화 */
  watchPermission();
  ensureTranslator();
})();
